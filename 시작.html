 function render(){const nav=[['screen','◫','기업 평가'],['flow','≋','거래량 관찰'],['lab','⌁','전략 연구실'],['portfolio','▥','모의 운용'],['company','◇','회사·분배'],['data','⚙','데이터 관리'],['research','↻','조회·자동분석']];
  const content=page==='screen'?screenPage():page==='flow'?flowPage():page==='lab'?labPage():page==='portfolio'?portfolioPage():page==='company'?companyPage():page==='data'?dataPage():page==='research'?window.AtlasResearch.page():detailPage();
  app.innerHTML='<div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-icon">Λ</span>ATLAS</div><div class="brand-sub">QUANT INVESTMENT STUDIO</div><nav class="nav" aria-label="주 메뉴">'+nav.map(([id,symbol,name])=>'<button data-action="page" data-page="'+id+'" class="'+(page===id||page==='detail'&&id==='screen'?'active':'')+'" '+(page===id?'aria-current="page"':'')+'><span class="nav-symbol" aria-hidden="true">'+symbol+'</span>'+name+'</button>').join('')+'</nav><div class="sidebar-foot"><span class="status-dot"></span>Mac local edition<br>연구·모의 운용 환경<br><span style="font-size:10px">v'+Q.VERSION+' · 조회 분석 · 계좌 없음</span></div></aside><main class="main"><div class="topbar"><div class="mobile-brand">Λ ATLAS</div><div class="eyebrow">INVESTMENT WORKSPACE / '+esc(pageNames[page])+'</div><div class="top-controls"><label class="visually-hidden" for="market">시장</label><select id="market"><option value="KR" '+(state.market==='KR'?'selected':'')+'>한국 · KRW</option><option value="US" '+(state.market==='US'?'selected':'')+'>미국 · USD</option></select><label class="visually-hidden" for="asof">평가일</label><input id="asof" type="date" value="'+esc(state.asOf)+'"><button class="btn small" data-action="latest">최신 자료일</button></div></div><div class="banner"><span><strong>'+(state.data.synthetic?'합성 예제 데이터':'사용자 입력 데이터 · 출처 검증 필요')+'</strong> · '+esc(state.data.source)+'</span><span>점수 자료: JSON / API 수집본 · 조회·자동분석 메뉴 · 주문 비활성</span></div>'+content+'<div class="footnote">ATLAS Mac · 70/30 점수와 매매 조건은 연구 가설이며 손실 방지나 수익성을 보장하지 않습니다. 입력 자료의 정확성·권리·공개 시점을 확인하세요. 모의 결과를 실제 운용 실적으로 표시하지 마세요.</div></main></div>';
 }
 function download(name,text,type='application/json'){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 function csvCell(v){let s=String(v??'');if(/^\s*[=+@-]/.test(s)&&typeof v!=='number')s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
 function exportCSV(name,header,body){download(name,'\uFEFF'+[header,...body].map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
 function schemaText(){return '# ATLAS Mac 데이터 형식 v1\n\n예제 JSON 구조를 유지하세요. schemaVersion=1, synthetic=true/false, source=출처, priceBasis=split-consistent.\n\n종목: id/name/sector 문자열, market KR 또는 US, currency KRW 또는 USD, financialSector boolean.\nbars: 25~2500행, date YYYY-MM-DD 오름차순 중복 없음, open/high/low/close 양수, volume 0 이상. 시장별 동일 거래일 배열이어야 연구 백테스트가 가능합니다.\n\n재무 snapshots: periodEnd ≤ filedAt ≤ availableAt. 날짜 단위입니다. 공시 시각을 모르면 availableAt을 다음 거래일로 지정하세요. version은 종목별 고유 문자열입니다. restatement를 덮어쓰지 말고 별도 버전으로 추가하세요.\n\n금액은 해당 통화·TTM 기준입니다. revenue 매출, operatingIncome 영업이익, netIncome 보통주 주주 귀속 순이익, equity 보통주 주주 귀속 자본, cfo 영업현금흐름, capex 설비투자 지출(양수), shares 가격 기준과 일치하는 주식수, debt 이자부 부채, cash 현금, interest TTM 이자비용, investedCapital 투하자본, taxRate 0~1, previousRevenue 전년 TTM 매출, previousOperatingIncome 전년 TTM 영업이익, previousMargin 전년 영업이익률(0~1), dilution 전년 대비 주식수 증가율(비율). 결측은 null.\n\n원가격·분할 조정가격·재무 주식수 기준이 섞이면 PER/PBR이 왜곡됩니다. 표준화는 제공자별로 직접 확인하세요. ROI는 단순 추정. EV는 시가총액+부채−현금. 금융업 모델은 미지원.\n\nflags: [{date,type,note}]. type halt/accounting/delisted는 해당 날짜 이후 지속적인 평가 제한이며 해제 기능은 없습니다. event는 10일간 신규 후보 선정을 보류합니다. 과거 해제 이력이 있는 경우 현재 형식의 한계를 확인하세요.\n\n백테스트: 전일 종가 기준 선별 → 당일 종가 모의 체결. 정수 수량·편도 bp 비용·현금 범위 주문. 배당/세금/환전/호가/시장충격/비동일 거래일 상장폐지 처리 미지원. 전체 입력 기업 동일금액 매수·보유 비교. 연 252일·rf=0 샤프.\n\n브라우저 로컬 백업은 version/data/config/watch/accounts/company를 포함합니다. 비밀 키를 넣지 마세요. 최대 파일 크기 12MiB. 가져오기는 자료 교체와 모의 계좌 초기화를 수행합니다.\n';}
 function labInputs(){const form=document.getElementById('lab-form');if(!form.reportValidity())return null;const fd=new FormData(form),c={...state.config};for(const k of ['capital','topN','maxWeight','rebalance','minScore','minFundamental','minTechnical','feeBp',state.market==='KR'?'minTurnoverKR':'minTurnoverUS'])if(fd.has(k))c[k]=Number(fd.get(k));c.start=fd.get('start');c.end=fd.get('end');c.flowRequired=fd.has('flowRequired');return c;}
 function runLab(compare=false){const c=labInputs();if(!c)return;try{Q.config(c);if(compare){const base=Q.backtest(state.data,state.market,{...c,flowRequired:false}),flow=Q.backtest(state.data,state.market,{...c,flowRequired:true});result={...base,comparison:{base,flow}};}else result=Q.backtest(state.data,state.market,c);for(const k of Object.keys(Q.defaults))state.config[k]=c[k];labError='';persist();render();toast('연구 백테스트가 완료됐습니다.');}catch(e){labError=e.message;render();}}
 document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;try{
  if(action==='page'){page=button.dataset.page;selected=null;render();window.scrollTo(0,0);}
  else if(action==='detail'){selected=button.dataset.id;page='detail';render();window.scrollTo(0,0);}
  else if(action==='watch'){const id=button.dataset.id;state.watch=state.watch.includes(id)?state.watch.filter(x=>x!==id):[...state.watch,id];persist();render();}
  else if(action==='latest'){state.asOf=state.data.analysisAsOf||latestDate();result=null;persist();render();}
  else if(action==='paper-select'){paperSelected=button.dataset.id;page='portfolio';render();window.scrollTo(0,0);}
  else if(action==='ablation')runLab(true);
  else if(action==='export-scores'){const r=rows();exportCSV('atlas-scores-'+state.market+'-'+state.asOf+'.csv',['id','name','asOf','status','total100','fundamental70','technical30','valuePoints','qualityPoints','safetyPoints','growthPoints','volume10','trend8','momentum6','volatility6','PER','PBR','volumeRatio','reasons','source'],r.map(x=>[x.stock.id,x.stock.name,state.asOf,x.eligible?'eligible':'excluded',x.eligible?x.total:'',x.fundamental,x.technical,x.value*state.config.valueWeight/100,x.quality*state.config.qualityWeight/100,x.safety*state.config.safetyWeight/100,x.growth*state.config.growthWeight/100,x.tech.parts.volume,x.tech.parts.trend,x.tech.parts.momentum,x.tech.parts.volatility,x.metrics.per,x.metrics.pbr,x.flow.ratio,[...x.reasons,...x.entryReasons].join('; '),state.data.source]));}
  else if(action==='export-trades'){if(result)exportCSV('atlas-research-trades.csv',['date','signalDate','id','side','quantity','price','fee','source'],result.trades.map(t=>[t.date,t.signalDate,t.id,t.side,t.quantity,t.price,t.fee,state.data.source]));}
  else if(action==='backup')download('atlas-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2));
  else if(action==='export-data')download('atlas-analysis-data.json',JSON.stringify(state.data,null,2));
  else if(action==='sample-data')download('atlas-example-data.json',JSON.stringify(Q.sample(),null,2));
  else if(action==='export-schema')download('atlas-data-format.txt',schemaText(),'text/plain;charset=utf-8');
  else if(action==='import-data'){document.getElementById('import-file').dataset.mode='data';document.getElementById('import-file').click();}
  else if(action==='restore'){document.getElementById('import-file').dataset.mode='backup';document.getElementById('import-file').click();}
  else if(action==='reset-paper'){if(confirm('현재 시장의 모의 계좌를 초기화할까요? 실제 계좌에는 영향이 없습니다.')){state.accounts[state.market]=account(state.market);persist();render();}}
  else if(action==='reset-demo'){if(confirm('전체 분석 자료·관심 목록·모의 계좌를 예제로 초기화할까요? 먼저 JSON 백업을 저장하세요.')){state=initial();result=null;filter={query:'',sector:'',mode:'all'};persist();render();}}
 }catch(e){toast(e.message);}});
 document.addEventListener('change',event=>{const id=event.target.id;if(id==='market'){state.market=event.target.value;state.asOf=state.data.analysisAsOf||latestDate();selected=null;paperSelected=null;filter={query:'',sector:'',mode:'all'};if(page==='detail')page='screen';result=null;persist();render();}else if(id==='asof'){if(Q.date(event.target.value)){state.asOf=event.target.value;result=null;persist();render();}}else if(id==='sector-filter'||id==='mode-filter'){filter[id==='sector-filter'?'sector':'mode']=event.target.value;render();}else if(event.target.name==='stockId'&&page==='portfolio'){paperSelected=event.target.value;render();}});
 document.addEventListener('input',event=>{if(event.target.id==='search'){const at=event.target.selectionStart;filter.query=event.target.value;render();const input=document.getElementById('search');input.focus();input.setSelectionRange(at,at);}});
 document.addEventListener('submit',event=>{event.preventDefault();const form=event.target,fd=new FormData(form);try{
  if(form.id==='flow-form'||form.id==='weights-form'){const c={...state.config};for(const [k,v] of fd)c[k]=Number(v);state.config=Q.config(c);result=null;persist();render();toast('평가 조건을 적용했습니다.');}
  else if(form.id==='lab-form')runLab();
  else if(form.id==='paper-form'){const s=state.data.stocks.find(x=>x.id===fd.get('stockId'));state.accounts[state.market]=Q.paperOrder(state.accounts[state.market],s,fd.get('side'),Number(fd.get('quantity')),state.config.feeBp);persist();render();toast('모의 체결을 기록했습니다. 실제 주문은 전송되지 않습니다.');}
  else if(form.id==='company-form'){const c=Object.fromEntries([...fd].map(([k,v])=>[k,Number(v)]));Q.distribution(c);state.company=c;persist();render();toast('분배 가정 금액을 계산했습니다.');}
 }catch(e){toast(e.message);}});
 document.getElementById('import-file').addEventListener('change',async event=>{const input=event.target,file=input.files[0];if(!file)return;try{if(file.size>12*1024*1024)throw Error('최대 12MiB JSON 파일을 지원합니다.');const parsed=JSON.parse(await file.text());if(input.dataset.mode==='backup'){const restored=validateState(parsed);if(!confirm('전체 백업으로 현재 자료와 모의 계좌를 교체할까요?'))return;state=restored;}else{Q.validate(parsed);if(!confirm('분석 자료를 교체하고 모의 계좌·관심 목록을 초기화할까요? 먼저 백업을 확인하세요.'))return;state.data=parsed;state.watch=[];state.accounts={KR:account('KR'),US:account('US')};state.market=parsed.stocks.some(s=>s.market===state.market)?state.market:parsed.stocks[0].market;state.asOf=parsed.analysisAsOf||latestDate();}result=null;selected=null;page='data';filter={query:'',sector:'',mode:'all'};persist();render();toast('자료를 가져왔습니다. 출처·공시 시점·분할 기준을 확인하세요.');}catch(e){toast('가져오기 실패: '+e.message);}finally{input.value='';}});
 window.AtlasLoadResearch=latest=>{
  Q.validate(latest.data);const ids=new Set(latest.data.stocks.map(s=>s.id));
  const invalid=Object.values(state.accounts).some(a=>Object.keys(a.positions).some(id=>!ids.has(id))||a.orders.some(o=>!ids.has(o.stockId)));
  if(invalid&&!confirm('새 분석 자료와 종목 ID가 달라 모의 계좌를 초기화합니다. 먼저 전체 백업을 보관하세요. 적용할까요?'))return;
  if(invalid)state.accounts={KR:account('KR'),US:account('US')};
  state.data=latest.data;state.watch=state.watch.filter(id=>ids.has(id));
  if(!state.data.stocks.some(s=>s.market===state.market))state.market=state.data.stocks[0].market;
  state.asOf=latest.asOf;result=null;selected=null;filter={query:'',sector:'',mode:'all'};page='screen';persist();render();toast('API 관측 자료를 적용했습니다. 가격일·관측일·평가 제한을 확인하세요.');
 };window.AtlasRefresh=render;render();if(startupMessage)toast(startupMessage);
})();
</script></body></html>
